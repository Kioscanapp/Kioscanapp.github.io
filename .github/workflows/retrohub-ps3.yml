name: Retrovicios PS3 Build

on:
  push:
    branches:
      - retrohub-ps3-build
    paths:
      - "retrohub/**"
      - ".github/workflows/retrohub-ps3.yml"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      BASELINE_ARTIFACT_ID: "10608406202"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install host tools
        run: |
          sudo apt-get update
          sudo apt-get install -y make python3 python3-pip python3-tk unzip fonts-dejavu-core
          python3 -m pip install --break-system-packages pycryptodomex customtkinter pillow

      - name: Install PS3DEV SDK
        run: |
          curl -fL --retry 3 \
            https://github.com/ps3dev/ps3dev/releases/download/nightly-2026-07-26/ps3dev-linux-X64.tar.gz \
            -o /tmp/ps3dev.tar.gz
          tar -xzf /tmp/ps3dev.tar.gz -C "$GITHUB_WORKSPACE"
          echo "PS3DEV=$GITHUB_WORKSPACE/ps3dev" >> "$GITHUB_ENV"
          echo "PSL1GHT=$GITHUB_WORKSPACE/ps3dev" >> "$GITHUB_ENV"
          echo "$GITHUB_WORKSPACE/ps3dev/bin" >> "$GITHUB_PATH"
          echo "$GITHUB_WORKSPACE/ps3dev/ppu/bin" >> "$GITHUB_PATH"
          echo "$GITHUB_WORKSPACE/ps3dev/spu/bin" >> "$GITHUB_PATH"

      - name: Reuse verified Retrovicios v1.4 cores
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          curl -fL --retry 3 \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/actions/artifacts/$BASELINE_ARTIFACT_ID/zip" \
            -o /tmp/retrovicios-baseline.zip
          mkdir -p /tmp/baseline-artifact
          unzip -q /tmp/retrovicios-baseline.zip -d /tmp/baseline-artifact
          BASE_PKG="$(find /tmp/baseline-artifact -maxdepth 2 -name '*.pkg' | head -n 1)"
          test -n "$BASE_PKG"

          curl -fL --retry 3 \
            https://raw.githubusercontent.com/AphelionWasTaken/PyKG/main/PyKG.py \
            -o /tmp/PyKG.py

          PYTHONPATH=/tmp python3 - <<'PY'
          from pathlib import Path
          import PyKG
          pkg = next(Path("/tmp/baseline-artifact").rglob("*.pkg"))
          out = Path("/tmp/baseline-extracted")
          PyKG.extract_pkg(pkg, out)
          core_dir = out / "RVIC00001" / "USRDIR" / "cores"
          cores = sorted(core_dir.glob("*.SELF"))
          if len(cores) < 24:
              raise SystemExit(f"Expected at least 24 Retrovicios cores, found {len(cores)}")
          print("Verified Retrovicios v1.4 cores:", len(cores))
          PY

          rm -rf retrohub/pkgfiles/USRDIR/cores
          mkdir -p retrohub/pkgfiles/USRDIR/cores
          cp /tmp/baseline-extracted/RVIC00001/USRDIR/cores/*.SELF retrohub/pkgfiles/USRDIR/cores/

      - name: Assemble Retrovicios package tree
        run: |
          mkdir -p retrohub/pkgfiles/USRDIR/data
          mkdir -p retrohub/pkgfiles/USRDIR/roms
          mkdir -p retrohub/pkgfiles/USRDIR/system
          mkdir -p retrohub/pkgfiles/USRDIR/savefiles
          mkdir -p retrohub/pkgfiles/USRDIR/savestates
          mkdir -p retrohub/pkgfiles/USRDIR/screenshots
          mkdir -p retrohub/pkgfiles/USRDIR/config
          mkdir -p retrohub/pkgfiles/USRDIR/covers
          mkdir -p retrohub/assets

          python3 - <<'PY'
          from PIL import Image, ImageDraw, ImageFont
          img=Image.new("RGB",(320,176),(3,7,16))
          d=ImageDraw.Draw(img)
          cyan=(0,226,255); pink=(255,39,193); white=(235,245,255)
          title=ImageFont.truetype("/usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf",37)
          small=ImageFont.truetype("/usr/share/fonts/truetype/dejavu/DejaVuSans.ttf",13)
          for y in range(104,176,9): d.line((0,y,320,y),fill=(12,24,42))
          for x in range(0,321,24): d.line((160,104,x,176),fill=(12,24,42))
          d.rectangle((14,16,306,96),outline=cyan,width=2)
          d.rectangle((18,20,302,92),outline=pink,width=1)
          d.text((27,31),"RETRO",font=title,fill=cyan)
          d.text((143,31),"VICIOS",font=title,fill=pink)
          d.text((74,111),"JUEGA  REVIVI  REPETI",font=small,fill=white)
          img.save("retrohub/assets/ICON0.PNG")
          PY

          cat > retrohub/pkgfiles/USRDIR/retroarch.cfg <<'EOF'
          menu_driver = "rgui"
          config_save_on_exit = "false"
          system_directory = "/dev_hdd0/game/RVIC00001/USRDIR/system"
          savefile_directory = "/dev_hdd0/game/RVIC00001/USRDIR/savefiles"
          savestate_directory = "/dev_hdd0/game/RVIC00001/USRDIR/savestates"
          screenshot_directory = "/dev_hdd0/game/RVIC00001/USRDIR/screenshots"
          input_menu_toggle_gamepad_combo = "0"
          input_quit_gamepad_combo = "4"
          EOF

          echo "Retrovicios PS3 v1.8 - interfaz moderna optimizada, caratula seleccionada, Sega CD y retorno directo" > retrohub/pkgfiles/USRDIR/data/README.TXT
          echo "Copia ROMs sueltas en /RETROVICIOS/roms/ o usa las carpetas por sistema." > retrohub/pkgfiles/USRDIR/roms/README.TXT
          echo "Caratulas JPG/PNG/BMP: /RETROVICIOS/covers/<sistema>/<mismo nombre de ROM>.jpg" >> retrohub/pkgfiles/USRDIR/roms/README.TXT
          echo "SELECT + START durante el juego cierra el core y vuelve directamente a Retrovicios." >> retrohub/pkgfiles/USRDIR/roms/README.TXT
          test "$(find retrohub/pkgfiles/USRDIR/cores -maxdepth 1 -name '*.SELF' | wc -l)" -ge 24

      - name: Build Retrovicios fixed PKG
        run: |
          test -x "$PS3DEV/portlibs/ppu/bin/sdl2-config"
          "$PS3DEV/portlibs/ppu/bin/sdl2-config" --version
          cd retrohub
          make -f Makefile.ps3 clean all
          cp retrovicios_ps3.pkg "$GITHUB_WORKSPACE/Retrovicios_PS3_v1.8_Rapido.pkg"
          ls -lh "$GITHUB_WORKSPACE/Retrovicios_PS3_v1.8_Rapido.pkg"

      - name: Upload final package
        uses: actions/upload-artifact@v4
        with:
          name: Retrovicios_PS3_v1.8_Rapido
          path: Retrovicios_PS3_v1.8_Rapido.pkg
          if-no-files-found: error
