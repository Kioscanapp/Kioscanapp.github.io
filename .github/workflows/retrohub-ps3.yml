name: RetroHub PS3 Build

on:
  push:
    branches:
      - retrohub-ps3-build
    paths:
      - "retrohub/**"
      - ".github/workflows/retrohub-ps3.yml"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      BASELINE_ARTIFACT_ID: "10593371072"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install host tools
        run: |
          sudo apt-get update
          sudo apt-get install -y make python3 python3-pip python3-tk unzip
          python3 -m pip install --break-system-packages pycryptodomex customtkinter

      - name: Install PS3DEV SDK
        run: |
          curl -fL --retry 3             https://github.com/ps3dev/ps3dev/releases/download/nightly-2026-07-26/ps3dev-linux-X64.tar.gz             -o /tmp/ps3dev.tar.gz
          tar -xzf /tmp/ps3dev.tar.gz -C "$GITHUB_WORKSPACE"
          echo "PS3DEV=$GITHUB_WORKSPACE/ps3dev" >> "$GITHUB_ENV"
          echo "PSL1GHT=$GITHUB_WORKSPACE/ps3dev" >> "$GITHUB_ENV"
          echo "$GITHUB_WORKSPACE/ps3dev/bin" >> "$GITHUB_PATH"
          echo "$GITHUB_WORKSPACE/ps3dev/ppu/bin" >> "$GITHUB_PATH"
          echo "$GITHUB_WORKSPACE/ps3dev/spu/bin" >> "$GITHUB_PATH"

      - name: Reuse verified RetroHub v1.0 cores
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          curl -fL --retry 3             -H "Authorization: Bearer $GH_TOKEN"             -H "Accept: application/vnd.github+json"             "https://api.github.com/repos/${{ github.repository }}/actions/artifacts/$BASELINE_ARTIFACT_ID/zip"             -o /tmp/retrohub-baseline.zip
          mkdir -p /tmp/baseline-artifact
          unzip -q /tmp/retrohub-baseline.zip -d /tmp/baseline-artifact
          BASE_PKG="$(find /tmp/baseline-artifact -maxdepth 2 -name '*.pkg' | head -n 1)"
          test -n "$BASE_PKG"

          curl -fL --retry 3             https://raw.githubusercontent.com/AphelionWasTaken/PyKG/main/PyKG.py             -o /tmp/PyKG.py

          PYTHONPATH=/tmp python3 - <<'PY'
          from pathlib import Path
          import os
          import PyKG
          pkg = next(Path("/tmp/baseline-artifact").rglob("*.pkg"))
          out = Path("/tmp/baseline-extracted")
          PyKG.extract_pkg(pkg, out)
          core_dir = out / "RHUB00001" / "USRDIR" / "cores"
          cores = sorted(core_dir.glob("*.SELF"))
          if len(cores) != 15:
              raise SystemExit(f"Expected 15 verified cores, found {len(cores)}")
          print("Verified baseline cores:", len(cores))
          PY

          mkdir -p retrohub/pkgfiles/USRDIR/cores
          cp /tmp/baseline-extracted/RHUB00001/USRDIR/cores/*.SELF retrohub/pkgfiles/USRDIR/cores/

      - name: Assemble RetroHub package tree
        run: |
          mkdir -p retrohub/pkgfiles/USRDIR/data
          mkdir -p retrohub/pkgfiles/USRDIR/roms
          mkdir -p retrohub/pkgfiles/USRDIR/system
          mkdir -p retrohub/pkgfiles/USRDIR/savefiles
          mkdir -p retrohub/pkgfiles/USRDIR/savestates
          mkdir -p retrohub/pkgfiles/USRDIR/screenshots
          mkdir -p retrohub/pkgfiles/USRDIR/config
          mkdir -p retrohub/assets

          cp "$PS3DEV/bin/ICON0.PNG" retrohub/assets/ICON0.PNG

          cat > retrohub/pkgfiles/USRDIR/retroarch.cfg <<'EOF'
          menu_driver = "rgui"
          config_save_on_exit = "true"
          system_directory = "/dev_hdd0/game/RHUB00001/USRDIR/system"
          savefile_directory = "/dev_hdd0/game/RHUB00001/USRDIR/savefiles"
          savestate_directory = "/dev_hdd0/game/RHUB00001/USRDIR/savestates"
          screenshot_directory = "/dev_hdd0/game/RHUB00001/USRDIR/screenshots"
          EOF

          echo "RetroHub PS3 v1.1 Neon UI" > retrohub/pkgfiles/USRDIR/data/README.TXT
          echo "Use legal backups in /RETROHUB/roms/<system>/ on USB, or the internal roms folder."             > retrohub/pkgfiles/USRDIR/roms/README.TXT

          test "$(find retrohub/pkgfiles/USRDIR/cores -maxdepth 1 -name '*.SELF' | wc -l)" -eq 15

      - name: Build RetroHub Neon PKG
        run: |
          cd retrohub
          make -f Makefile.ps3 clean all
          cp retrohub_ps3.pkg "$GITHUB_WORKSPACE/RetroHub_PS3_v1.1_Neon.pkg"
          ls -lh "$GITHUB_WORKSPACE/RetroHub_PS3_v1.1_Neon.pkg"

      - name: Upload final package
        uses: actions/upload-artifact@v4
        with:
          name: RetroHub_PS3_v1.1_Neon
          path: RetroHub_PS3_v1.1_Neon.pkg
          if-no-files-found: error
